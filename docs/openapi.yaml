  /v1/migration/product/id/{id}:
    post:
      tags:
        - migration tag
      summary: /v1/migration/product/{id}
      description: >-
        ### Create Product Migration


        inserta en la db solo el id de una publicacion exiteste para fixear
        inconsistencias


        This endpoint is used to migrate a product with the specified ID to a
        new version.


        #### Request Body


        - No request body is required for this endpoint.


        #### Response
          [
              "MCO1382734853"
          ]


         ```
      requestBody:
        content: {}
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          example: '2'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
            Date:
              schema:
                type: string
                example: Wed, 19 Apr 2023 23:22:23 GMT
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
          content:
            application/json:
              schema:
                type: object
  /v1/migration/update/products/ids:
    post:
      tags:
        - migration tag
      summary: /v1/migration/update/products/ids
      description: >-
        ### Update Products IDs Migration


        sincronizar ids publicaciones de cuenta desde meli a db


        This endpoint is used to synchronize the publication of account data
        from Meli to the database.


        #### Request Body


        - `product_ids` (array of strings) - The IDs of the products to be
        updated.


        #### Response Body


        - `success` (boolean) - Indicates if the update operation was
        successful.

        - `message` (string) - A message providing details about the update
        operation.
      requestBody:
        content: {}
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          description: id de account (no confundir el el code de ML) 189482140
          example: '2'
        - name: status
          in: header
          description: Estado de las publicaciones a consultar
          schema:
            type: string
            enum:
                - active
                - inactive
                - paused
                - deleted
                - inactive
                - closed
                - ''
          example: 'active'
        - name: channels
          in: header
          description: Canales de venta a consultar
          schema:
            type: string
            enum:
              - marketplace
              - marketplace,mshops
          example: 'marketplace'
        - name: read-mode
          in: header
          schema:
            type: boolean
          description: >-
            true, false  indica si solo se ejcuta en modo lectura o tambien
            almacenad los ids
          example: 'true'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/migration/delete/products/ids:
    get:
      tags:
        - migration tag
      summary: /v1/migration/delete/products/ids
      description: >-
        ### Update Products IDs Migration


        Lista las publicaciones de la db que ya no tienen publicacion en la
        cuenta meli, si el modo read-mode esta de false, las elimina de la db
        (en cascada elimina las relaciones vigentes)


        #### Request Body


        - `product_ids` (array of strings) - The IDs of the products to be
        updated.


        #### Response Body


        ``` json

        {
          "type": "object",
          "properties": {
            "count": {
              "type": "integer"
            },
            "publications_ids": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          }
        }

         ```
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          description: id de account (no confundir el el code de ML) 189482140
          example: '2'
        - name: status
          in: header
          schema:
            type: string
            enum:
                - active
                - inactive
                - paused
                - deleted
                - inactive
                - closed
                - ''
          description: active, o vacio

        - name: channels
