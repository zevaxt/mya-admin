                      descriptions:
                        - >-
                          3 COLORES DE ILUMINACIÓN Y 9 BRILLO:

                          El anillo de luz tiene 3 colores de iluminación:
                          blanco, blanco cálido y amarillo cálido, cada modo
                          tiene 9 brillo ajustable, el rango de atenuación es
                          del 1% al 100%, suficiente para satisfacer tus
                          diferentes necesidades de iluminación. El diseño de
                          pantalla en forma de arco hace que la luz sea más
                          suave, sin sombra, sin reflejos, tiene como objetivo
                          producir una luz continua y difusa que casi cualquier
                          tema parezca más bonito.


                          ALIMENTADO POR USB Y CONTROL REMOTO INALÁMBRICO:

                          No necesita batería, funciona con la mayoría de
                          dispositivos que soportan puerto USB, como un
                          portátil, PC, banco de energía, cargador USB,
                          adaptador de CA, etc. Libera tus manos con el control
                          remoto inalámbrico (compatible con control remoto de
                          33 pies), es ideal para tomar selfie y capturar buenos
                          momentos con amigos y registrar la vida diaria
                          familiar a una distancia adecuada.


                          PLEGABLE, EXPANDIBLE Y PORTÁTIL:

                          Con trípode de suelo y soporte de escritorio, mini y
                          plegable, bastante portátil, plegado de 7.28 pulgadas
                          de longitud, totalmente estirado de 28.54 pulgadas,
                          suficiente para satisfacer tus diferentes necesidades.
                          Este anillo de luz para selfie pesa solo 7.41 oz y se
                          puede llevar contigo, como viajes, deportes al aire
                          libre, fiestas, etc. Graba diferentes momentos
                          maravillosos para ti.


                          USO MULTIFUNCIÓN:

                          Gran anillo de luz LED para el trabajo diario y la
                          vida. Ideal para un tutorial de maquillaje, videos
                          móviles de forma corta Tiktok, Facebook, Instagram,
                          grabación de video de YouTube y transmisión en vivo,
                          videoconferencia de zoom, enseñanza en línea. Perfecto
                          para todo tipo de fotografía y filmación de primer
                          plano. Como moda, publicidad, retrato, boda. Te hace
                          brillar como una estrella.


                          SOPORTE GIRATORIO DE 360°:

                          Con el diseño giratorio de 360°, puedes elegir entre
                          modos horizontal o vertical para obtener el mejor
                          ángulo para tus fotos.


                          AMPLIA COMPATIBILIDAD

                          El palo selfie es adecuado para la mayoría de
                          teléfonos móviles. El mando a distancia Bluetooth es
                          perfectamente compatible con teléfonos iPhone y
                          Android, conexión de un solo clic, como iPhone 12 Pro
                          Max / 12 Pro / 12 / 11 / XS MAX / XR / XS / X / 8 / 8
                          Plus Series, Samsung Galaxy S21 / Note 20 Series y la
                          mayoría de otros smartphones.
