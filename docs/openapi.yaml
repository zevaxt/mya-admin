                      descriptions:
                        - >-
                          •Control remoto y control de voz:
                           Sigue conectando bombillas WiFi con tu red doméstica, puedes controlar de forma remota las bombillas Alexa o comprobar el estado de las bombillas a través de la aplicación en tu smartphone cuando salgas de casa o viajas. Simplemente da un comando de voz para encender/apagar o atenuar/iluminar tus bombillas inteligentes. Las bombillas inteligentes Treatlife funcionan con Echo Dot, Google Home Assistant y SmartThings.

                          •Blanco sintonizable y 0%-100% atenuación:
                           Diferente de otras bombillas, la bombilla LED regulable Treatlife se puede ajustar suavemente de 2500 K blanco cálido a 6500 K blanco frío, y el rango de atenuación es del 1% al 100%. Simplemente controla en la aplicación, puedes ajustar el brillo y la temperatura de color para crear un ambiente relajante y cómodo que se adapte a tu estado de ánimo.


                          •Fácil de instalar y ahorro de energía:
                           Simplemente atornilla las bombillas inteligentes en cualquier enchufe estándar E26. No requiere concentrador. No funciona con interruptor inteligente e interruptor de atenuación. Pocos pasos para conectar con la aplicación del teléfono. Wi-Fi 2.4G (no 5G). Luces inteligentes de bajo consumo de solo 9 W de potencia, equivalente a bombillas incandescentes tradicionales de 60 W. Ahorra hasta un 80% de energía, vida útil más larga de la bombilla y reduce tus facturas.

                          •Ajuste de horarios y control de grupo:

                          Puedes configurar horarios para que la luz inteligente
                          se encienda y apague de acuerdo a tus rutinas diarias.
                          Compatible con temporizador de cuenta atrás, amanecer
                          y atardecer. También puedes crear un grupo para todas
                          tus bombillas de eco para Alexa y controlarlas todas
                          con un solo comando. No hay necesidad de comprobar
                          cada habitación y apagar las luces.



                          •Amplia aplicación y soporte sin complicaciones:
                           Las bombillas inteligentes que funcionan con Alexa son casquillo E26, A19, 9 W, se adaptan a la mayoría de iluminación del hogar. Puedes configurar diferentes modos de luz para que coincida con varias ocasiones, incluyendo cocina, sala de estar, dormitorio, cafetería, bar, fiesta, etc. Nuestro equipo técnico siempre apoya a los clientes con guía profesional de instalación y conexión. Por favor, ponte en contacto con nosotros a tiempo para activar tu servicio de garantía para obtener la mejor solución por primera vez.
