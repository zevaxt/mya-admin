openapi: 3.0.0
info:
  title: MercaloYa Doc
  version: 1.0.0
servers:
  - url: http://localhost:4200
components:
  schemas:
    Publication:
      type: object
      properties:
        ID:
          type: string
          description: ID único de la publicación
        AccountID:
          type: integer
          format: uint
          description: ID de la cuenta a la que pertenece la publicación
        SyncActive:
          type: boolean
          description: Indica si la sincronización está activa
        CatalogActive:
          type: boolean
          description: Indica si es una publicación de catálogo
        Status:
          type: boolean
          description: Estado de la publicación
        IsPopulate:
          type: boolean
          description: Indica si la publicación ha sido poblada con datos completos
        StatusML:
          type: string
          description: Estado de la publicación en Mercado Libre (active, inactive, paused, etc.)
        ExtCreatedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de creación en la plataforma externa (Mercado Libre)
        ExtUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de última actualización en la plataforma externa (Mercado Libre)
        CreatedAt:
          type: string
          format: date-time
          description: Fecha de creación en la base de datos
        UpdatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización en la base de datos
        DeletedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de eliminación (soft delete)
    Account:
      type: object
      properties:
        ID:
          type: integer
          format: uint
          description: ID único de la cuenta
    SyncActiveRequest:
      type: object
      properties:
        sync_active:
          type: boolean
          description: Nuevo valor para el campo SyncActive (true o false)
      required:
        - sync_active
    SyncActiveResponse:
      type: object
      properties:
        message:
          type: string
          description: Mensaje de confirmación
        publication_id:
          type: string
          description: ID de la publicación actualizada
        sync_active:
          type: boolean
          description: Valor actualizado del campo SyncActive
        CreatedAt:
          type: string
          format: date-time
          description: Fecha de creación
        UpdatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización
        DeletedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de eliminación (soft delete)
        ProviderID:
          type: integer
          format: uint
          description: ID del proveedor asociado
        UserID:
          type: integer
          format: uint
          description: ID del usuario propietario
        AuthorizationCode:
          type: string
          description: Código de autorización
        Email:
          type: string
          description: Correo electrónico asociado a la cuenta
        Nickname:
          type: string
          description: Nombre de usuario en la plataforma
        Code:
          type: string
          description: Código identificador de la cuenta
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
tags:
  - name: session tag
  - name: provider tag
  - name: migration tag
  - name: account tag
paths:
  /v1/migration/products/{id}/sync-active:
    patch:
      tags:
        - migration tag
      summary: Actualiza el campo SyncActive de una publicación
      description: Permite activar o desactivar la sincronización de una publicación específica
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la publicación a actualizar
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncActiveRequest'
      responses:
        '200':
          description: Estado de sincronización actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncActiveResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Publicación no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/signup:
    post:
      tags:
        - session tag
      summary: /v1/signup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: admin
                password: admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
            Date:
              schema:
                type: string
                example: Mon, 21 Apr 2025 00:28:39 GMT
            Content-Length:
              schema:
                type: integer
                example: '222'
          content:
            application/json:
              schema:
                type: object
              example:
                ID: 1
                CreatedAt: '2025-04-20T19:28:39.089-05:00'
                UpdatedAt: '2025-04-20T19:28:39.089-05:00'
                DeletedAt: null
                Password: pass
                Username: admin
                Accounts: null
  /v1/refresh-token:
    post:
      tags:
        - session tag
      summary: Renovar token JWT
      description: >
        ### Descripción


        Este endpoint permite renovar un token JWT existente y válido sin requerir
        que el usuario vuelva a autenticarse. El token actual debe ser válido y no
        haber expirado.


        ### Parámetros de la solicitud


        - **Method:** POST


        - **Headers requeridos:**
          - `Authorization`: Bearer {token_actual}


        - **Cuerpo de la solicitud:** No requiere cuerpo (puede ser un objeto vacío {})


        ### Estructura de la respuesta


        La respuesta es un objeto JSON con los siguientes campos:


        - `token` (string): El nuevo token JWT generado


        - `expiresAt` (number): Timestamp Unix en segundos que indica cuándo expira el token


        ### Códigos de respuesta


        - **200 OK**: Token renovado exitosamente


        - **401 Unauthorized**: Token inválido o expirado
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: {}
      responses:
        '200':
          description: Token renovado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: El nuevo token JWT generado
                  expiresAt:
                    type: integer
                    description: Timestamp Unix en segundos que indica cuándo expira el token
                example:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresAt: 1632150000
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: string
                    example: '003'
                  Status:
                    type: integer
                    example: 401
                  Message:
                    type: string
                    example: 'Sus datos de autenticacion son invalidos por favor intente nuevamente'
                  TecnicalDetails:
                    type: string
                    example: 'Token inválido o expirado: el token ha expirado'
  /v1/signin:
    post:
      tags:
        - session tag
      summary: /v1/signin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: admin
                password: admin
      security:
        - noauthAuth: []
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
            Date:
              schema:
                type: string
                example: Mon, 21 Apr 2025 00:31:01 GMT
            Content-Length:
              schema:
                type: integer
                example: '222'
          content:
            application/json:
              schema:
                type: object
              example:
                ID: 1
                CreatedAt: '2025-04-20T19:28:39.089-05:00'
                UpdatedAt: '2025-04-20T19:28:39.089-05:00'
                DeletedAt: null
                Password: $2a$08$C4R7wShc6ucWDXiPXCpQVO69I2x97PBkwYNAsA//dj.hdUqFZffEe
                Username: admin
                Accounts: null
  /meli/login:
    post:
      tags:
        - session tag
      summary: /v1/signin Copy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: admin
                password: admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/migration/token/refresh/{id}:
    post:
      tags:
        - session tag
      summary: /v1/migration/token/refresh/{id}
      description: >-
        ### Refresh Migration Token


        Actualiza consultando token por id de la tabla refresh token.


        This endpoint allows the user to refresh a migration token.


        #### Request


        - Method: POST

        - URL: `{{sv}}/v1/migration/token/refresh/{id}`

        - Body:

            - `refresh_token` (text, required): The refresh token to be used for refreshing the migration token.


        #### Response


        The response for this request is a JSON schema. It includes the
        following properties:


        - `access_token`: The new access token.

        - `token_type`: The type of token.

        - `expires_in`: The duration for which the token is valid.

        - `refresh_token`: The new refresh token.
      requestBody:
        content: {}
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/migration/token/{id}:
    get:
      tags:
        - session tag
      summary: /v1/migration/token/{id}
      description: Consultar token por id de la tabla refresh token.
      security:
        - bearerAuth: []
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: '{{access_token}}'
        - name: authorization-to
          in: header
          schema:
            type: string
          description: token cuenta destino
          example: '{{access_token_mya}}'
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: account-id-to
          in: header
          schema:
            type: integer
          example: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/migration/update/products/one:
    post:
      tags:
        - provider tag
      summary: /v1/provider/migration/update/products/one
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: account-id-to
          in: header
          schema:
            type: integer
          example: '2'
        - name: publication-id
          in: header
          schema:
            type: string
          example: MCO1373151259
        - name: publication-id-to
          in: header
          schema:
            type: string
          example: MCO2855721930
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/products/ids:
    post:
      tags:
        - provider tag
      summary: /v1/migration/provider/ids
      requestBody:
        content: {}
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: '{{access_token_mya}}'
        - name: account-id
          in: header
          schema:
            type: integer
          example: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/publication/{id}:
    get:
      tags:
        - provider tag
      summary: v1/provider/publication/{id}
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: '{{access_token_mya}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/publications/deprecated:
    get:
      tags:
        - provider tag
      summary: Encontrar publicaciones deprecadas en DB
      description: >
        ### Descripción


        Este endpoint identifica las publicaciones almacenadas en la base de datos que ya no existen
        en Mercado Libre para una cuenta específica. Estas publicaciones son consideradas "deprecadas"
        ya que existen en la base de datos local pero ya no en el proveedor (Mercado Libre).


        ### Parámetros de la solicitud


        - **Method:** GET


        - **Endpoint:** `/v1/provider/publications/deprecated`


        - **Headers requeridos:**
          - `account-id`: ID de la cuenta de Mercado Libre a consultar
          - `status` (opcional): Estado de las publicaciones a consultar. Valores permitidos: "active", "inactive", "paused", "deleted", "suspended", "freezed" o vacío.
          - `channels` (opcional): Canales de venta a consultar. Valores permitidos: "marketplace" (por defecto), "mshops", o "marketplace,mshops".
        ### Estructura de la respuesta


        La respuesta es un objeto JSON con los siguientes campos:


        - `total` (número): Cantidad total de publicaciones huérfanas encontradas.


        - `orphan_publication_ids` (array de strings): Lista de IDs de publicaciones que existen en la base de datos pero no en Mercado Libre.


        ### Códigos de respuesta


        - **200 OK**: La búsqueda se realizó correctamente.


        - **400 Bad Request**: Parámetros de solicitud inválidos.


        - **500 Internal Server Error**: Error al procesar la solicitud.


        ### Ejemplo de respuesta


        ```json
        {
          "total": 3,
          "orphan_publication_ids": [
            "MCO123456789",
            "MCO987654321",
            "MCO567891234"
          ]
        }
        ```
      parameters:
        - name: account-id
          in: header
          required: true
          description: ID de la cuenta de Mercado Libre a consultar
          schema:
            type: string
          example: '1'
        - name: status
          in: header
          description: Estado de las publicaciones a consultar
          schema:
            type: string
            enum:
              - active
              - inactive
              - paused
              - deleted
              - inactive
              - closed
              - ''
          example: 'active'
        - name: channels
          in: header
          description: Canales de venta a consultar
          schema:
            type: string
            enum:
              - marketplace
              - mshops
              - marketplace,mshops
          example: 'marketplace'
      responses:
        '200':
          description: Búsqueda exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Cantidad total de publicaciones huérfanas
                  orphan_publication_ids:
                    type: array
                    items:
                      type: string
                    description: Lista de IDs de publicaciones que existen en la base de datos pero no en Mercado Libre
        '400':
          description: Parámetros de solicitud inválidos
        '500':
          description: Error al procesar la solicitud
      security:
        - bearerAuth: []

  /v1/provider/publications/compare:
    get:
      tags:
        - provider tag
      summary: Comparar publicaciones en DB vs Mercado Libre
      description: >
        ### Descripción


        Este endpoint compara las publicaciones almacenadas en la base de datos con las publicaciones
        existentes en Mercado Libre para una cuenta específica. Devuelve una lista de IDs de publicaciones
        que existen en Mercado Libre pero no están registradas en la base de datos local.


        ### Parámetros de la solicitud


        - **Method:** GET


        - **Endpoint:** `/v1/provider/publications/compare`


        - **Headers requeridos:**
          - `account-id`: ID de la cuenta de Mercado Libre a consultar
          - `status`: Estado de las publicaciones a consultar
          - `channels`: Canales de venta a consultar


        ### Estructura de la respuesta


        La respuesta es un objeto JSON con los siguientes campos:


        - `total` (número): Cantidad total de publicaciones faltantes.


        - `missing_publication_ids` (array de strings): Lista de IDs de publicaciones que existen en Mercado Libre pero no en la base de datos.


        ### Códigos de respuesta


        - **200 OK**: La comparación se realizó correctamente.


        - **400 Bad Request**: Parámetros de solicitud inválidos.


        - **500 Internal Server Error**: Error al procesar la solicitud.


        ### Ejemplo de respuesta


        ```json
        {
          "total": 3,
          "missing_publication_ids": [
            "MCO123456789",
            "MCO987654321",
            "MCO567891234"
          ]
        }
        ```
      parameters:
        - name: account-id
          in: header
          required: true
          description: ID de la cuenta de Mercado Libre a consultar
          schema:
            type: string
          example: '1'
        - name: status
          in: header
          description: Estado de las publicaciones a consultar
          schema:
            type: string
            enum:
              - active
              - inactive
              - paused
              - deleted
              - inactive
              - closed
              - ''
          example: 'active'
        - name: channels
          in: header
          description: Canales de venta a consultar
          schema:
            type: string
            enum:
              - marketplace
              - marketplace,mshops
          example: 'marketplace'
      responses:
        '200':
          description: Comparación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Cantidad total de publicaciones faltantes
                  missing_publication_ids:
                    type: array
                    items:
                      type: string
                    description: Lista de IDs de publicaciones que existen en Mercado Libre pero no en la base de datos
        '400':
          description: Parámetros de solicitud inválidos
        '500':
          description: Error al procesar la solicitud
      security:
        - bearerAuth: []
  /v1/migration/products/ids:
    get:
      tags:
        - migration tag
      summary: https://mercaloyaapi.loca.lt/v1/migration/products/ids
      parameters:
        - name: offset
          in: query
          description: Número de registros a omitir (para paginación)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          description: Número máximo de registros a devolver (para paginación)
          schema:
            type: integer
            default: 100
            minimum: 1
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
      description: >-
        ### Get Product IDs for Migration


        Consulta los ids almacenados en la bd de una cuenta


        ### Response Structure


        The response is a JSON object containing the following fields:


        - `publications_ids` (array of strings): An array containing the product IDs.

        - `total` (number): The total count of product IDs available for the account.

        - `offset` (number): The offset used in the request.

        - `limit` (number): The limit used in the request.


        Example:


        ``` json

        {
            "publications_ids": ["MCO1119265852", "MCO1146473973", "MCO1149637532"],
            "total": 437,
            "offset": 0,
            "limit": 3
        }

        ```
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/migration/products:
    get:
      tags:
        - migration tag
      summary: /v1/migration/products/
      parameters:
        - name: offset
          in: query
          description: Número de registros a omitir (para paginación)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          description: Número máximo de registros a devolver (para paginación)
          schema:
            type: integer
            default: 100
            minimum: 1
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
      description: >-
        ### Request Description

        - **products**: Array de objetos de publicación, cada uno contiene:
          - **ID**: Identificador único de la publicación.
          - **AccountID**: ID de la cuenta a la que pertenece la publicación.
          - **SyncActive**: Indica si la sincronización está activa.
          - **CatalogActive**: Indica si es una publicación de catálogo.
          - **Status**: Estado de la publicación.
          - **IsPopulate**: Indica si la publicación ha sido poblada con datos completos.
          - **StatusML**: Estado de la publicación en Mercado Libre (active, inactive, paused, etc.).
          - **ExtCreatedAt**: Fecha de creación en la plataforma externa (Mercado Libre).
          - **ExtUpdatedAt**: Fecha de última actualización en la plataforma externa (Mercado Libre).
          - **CreatedAt**: Fecha de creación en la base de datos.
          - **UpdatedAt**: Fecha de última actualización en la base de datos.
          - **DeletedAt**: Fecha de eliminación (soft delete).
        - **total**: Número total de publicaciones disponibles para la cuenta.
        - **offset**: El offset utilizado en la solicitud.
        - **limit**: El límite utilizado en la solicitud.


        ### Notas importantes


        - Este endpoint NO devuelve el campo `Attributes` para optimizar el rendimiento.
        - Si necesita acceder a los atributos completos de una publicación, use el endpoint `/v1/migration/product/{id}`.
        - Si no se proporcionan parámetros de paginación, se devolverán todas las publicaciones.


        ### Response Code


        - **200 OK**: Indica que la solicitud fue exitosa y se devuelven los datos de las publicaciones.
        - **409 Conflict**: Indica que hubo un error al procesar la solicitud.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de publicaciones obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Publication'
                  total:
                    type: integer
                    description: Número total de publicaciones disponibles
                  offset:
                    type: integer
                    description: Offset utilizado en la consulta
                  limit:
                    type: integer
                    description: Límite utilizado en la consulta
        '409':
          description: Error al procesar la solicitud
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: string
                    example: '001'
                  Status:
                    type: integer
                    example: 409
                  Message:
                    type: string
                    example: 'Error fetching publications'
                  TecnicalDetails:
                    type: string
                    example: 'Error al consultar la base de datos'
  /v1/migration/product/{id}:
