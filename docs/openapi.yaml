  /v1/migration/products/orphans:
    get:
      tags:
        - migration tag
      summary: /v1/migration/products/orphans
      description: >
        NoSyncPublicationOrphan obtiene los IDs de las publicaciones que no están sincronizadas y son huérfanas
        Este handler identifica publicaciones que:
        1. Pertenecen a una cuenta específica (account-id)
        2. No están sincronizadas con otras cuentas según el tipo de relación especificado:
           - Si relation-query-type es "outgoing": No aparecen como to_sync_id (salientes)
           - Si relation-query-type es "incoming": No aparecen como publication_id (entrantes)
           - Si relation-query-type es "both": No aparecen ni como to_sync_id ni como publication_id
        3. Por defecto, no están activas en el catálogo (catalog_active = false)
        4. Opcionalmente, filtradas por estado (true/false/all)
        5. Opcionalmente, filtradas por cantidad vendida (con/sin ventas)
        6. Opcionalmente, filtradas por catalog_active (true/false/all)
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: status
          in: header
          schema:
            type: boolean
          description: true, false, all
          example: 'true'
        - name: with-sold-quantity
          in: header
          schema:
            type: boolean
          description: true, false, all
          example: 'true'
        - name: catalog-active
          in: header
          schema:
            type: boolean
          description: true, false, all
          example: 'false'
        - name: relation-query-type
          in: header
          schema:
            type: string
            enum: [outgoing, incoming, both]
          description: Tipo de relación a consultar (outgoing, incoming, both). Por defecto es outgoing.
          example: 'outgoing'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Cantidad total de publicaciones huérfanas encontradas
                    example: 476
                  publication_ids:
                    type: array
                    description: Lista de IDs de publicaciones huérfanas
                    items:
                      type: string
                    example: ['MCO1033211161', 'MCO1034750110', 'MCO1034933991']
  /v1/migration/products/sync/stats:
    get:
      tags:
        - migration tag
      summary: /v1/migration/products/sync/stats
      description: >
        Obtiene estadísticas de sincronización de publicaciones para una cuenta específica.
        Este endpoint identifica:
        1. Las publicaciones de la cuenta
        2. Las relaciones de sincronización de cada publicación (entrantes y salientes)
        3. El total de publicaciones
      parameters:
        - name: account-id
          in: header
          required: true
          schema:
            type: integer
          description: ID de la cuenta para la que se quieren obtener las estadísticas
          example: 123
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: integer
                    description: ID de la cuenta consultada
                    example: 123
                  total_publications:
                    type: integer
                    description: Número total de publicaciones de la cuenta
                    example: 50
                  publications:
                    type: array
                    description: Lista de publicaciones con sus relaciones de sincronización
                    items:
                      type: object
                      properties:
                        publication_id:
                          type: string
                          description: ID de la publicación
                          example: 'MCO123456789'
                        account_id:
                          type: integer
                          description: ID de la cuenta a la que pertenece la publicación
                          example: 123
                        status_ml:
                          type: string
                          description: Estado de la publicación en Mercado Libre (active, inactive, paused, etc.)
                          example: 'active'
                        is_populate:
                          type: boolean
                          description: Indica si la publicación ha sido poblada con datos completos
                          example: true
                        catalog_active:
                          type: boolean
                          description: Indica si la publicación está activa en el catálogo
                          example: true
                        to_syncs:
                          type: array
                          description: Publicaciones a las que se ha sincronizado esta publicación
                          items:
                            type: object
                            properties:
                              to_sync_id:
                                type: string
                                description: ID de la publicación sincronizada
                                example: 'MCO987654321'
                              to_account_id:
                                type: integer
                                description: ID de la cuenta destino
                                example: 456
                              status_ml:
                                type: string
                                description: Estado de la publicación destino en Mercado Libre
                                example: 'active'
                              is_populate:
                                type: boolean
                                description: Indica si la publicación destino ha sido poblada con datos completos
                                example: true
                        from_syncs:
                          type: array
                          description: Publicaciones desde las que se ha sincronizado esta publicación
                          items:
                            type: object
                            properties:
                              from_publication_id:
                                type: string
                                description: ID de la publicación origen
                                example: 'MCO111222333'
                              from_account_id:
                                type: integer
                                description: ID de la cuenta origen
                                example: 789
                              status_ml:
                                type: string
                                description: Estado de la publicación origen en Mercado Libre
                                example: 'active'
                              is_populate:
                                type: boolean
                                description: Indica si la publicación origen ha sido poblada con datos completos
                                example: true
  /v1/migration/products/search:
    get:
      tags:
        - migration tag
      summary: /v1/migration/products/search
      description: >
        Busca publicaciones por ID parcial o completo.
        Este endpoint permite buscar publicaciones cuyo ID contenga el texto proporcionado.
        Devuelve una lista de publicaciones encontradas, sin incluir el campo Attributes.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: ID parcial o completo de la publicación a buscar
          example: 'MCO123'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica si la operación fue exitosa
                    example: true
                  total:
                    type: integer
                    description: Número total de publicaciones encontradas
                    example: 2
                  message:
                    type: string
                    description: Mensaje descriptivo del resultado
                    example: 'Publications found successfully'
                  publications:
                    type: array
                    description: Lista de publicaciones encontradas
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID de la publicación
                          example: 'MCO1234567890'
                        account_id:
                          type: integer
                          description: ID de la cuenta a la que pertenece la publicación
                          example: 1
                        sync_active:
                          type: boolean
                          description: Indica si la sincronización está activa
                          example: true
                        catalog_active:
                          type: boolean
                          description: Indica si la publicación está activa en el catálogo
                          example: false
                        status:
                          type: boolean
                          description: Estado de la publicación
                          example: true
                        is_populate:
                          type: boolean
                          description: Indica si la publicación ha sido poblada con datos completos
                          example: true
                        status_ml:
                          type: string
                          description: Estado de la publicación en Mercado Libre
                          example: 'active'
                        ext_created_at:
                          type: string
                          format: date-time
                          description: Fecha de creación en Mercado Libre
                          example: '2025-10-01T00:00:00Z'
                        ext_updated_at:
                          type: string
                          format: date-time
                          description: Fecha de última actualización en Mercado Libre
                          example: '2025-10-01T00:00:00Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: 'ID parameter is required'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: 'Error searching publications: database error'

  /v1/migration/products/sync/relations:
    post:
      tags:
        - migration tag
      summary: /v1/migration/products/sync/relations
      description: >
        Crea relaciones de sincronización entre publicaciones.
        Este endpoint permite crear una o múltiples relaciones de sincronización entre publicaciones.
        Cada relación conecta una publicación origen con una publicación destino.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sync_relations:
                  type: array
                  description: Lista de relaciones de sincronización a crear
                  items:
                    type: object
                    properties:
                      publication_id:
                        type: string
                        description: ID de la publicación origen
                        example: 'MCO123456789'
                      to_sync_id:
                        type: string
                        description: ID de la publicación destino
                        example: 'MCO987654321'
                      account_id_to:
                        type: integer
                        description: ID de la cuenta destino (opcional, se puede inferir de to_sync_id)
                        example: 456
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica si la operación fue exitosa
                    example: true
                  total_created:
                    type: integer
                    description: Número de relaciones creadas exitosamente
                    example: 3
                  total_failed:
                    type: integer
                    description: Número de relaciones que fallaron al crearse
                    example: 0
                  errors:
                    type: array
                    description: Lista de errores ocurridos durante la creación de relaciones
                    items:
                      type: object
                      properties:
                        publication_id:
                          type: string
                          description: ID de la publicación origen que falló
                          example: 'MCO123456789'
                        to_sync_id:
                          type: string
                          description: ID de la publicación destino que falló
                          example: 'MCO987654321'
                        message:
                          type: string
                          description: Mensaje de error
                          example: 'Relation already exists'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica si la operación fue exitosa
                    example: false
                  total_created:
                    type: integer
                    description: Número de relaciones creadas exitosamente
                    example: 0
                  total_failed:
                    type: integer
                    description: Número de relaciones que fallaron al crearse
                    example: 1
                  errors:
                    type: array
                    description: Lista de errores ocurridos durante la creación de relaciones
                    items:
                      type: object
                      properties:
                        publication_id:
                          type: string
                          description: ID de la publicación origen que falló
                          example: 'MCO123456789'
                        to_sync_id:
                          type: string
                          description: ID de la publicación destino que falló
                          example: 'MCO987654321'
                        message:
                          type: string
                          description: Mensaje de error
                          example: 'Publication origin not found'
    delete:
      tags:
        - migration tag
      summary: /v1/migration/products/sync/relations
      description: >
        Elimina relaciones de sincronización entre publicaciones.
        Este endpoint permite eliminar una o múltiples relaciones de sincronización entre publicaciones.
        Cada relación se identifica por el par de IDs publication_id y to_sync_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sync_relations:
                  type: array
                  description: Lista de relaciones de sincronización a eliminar
                  items:
                    type: object
                    properties:
                      publication_id:
                        type: string
                        description: ID de la publicación origen
                        example: 'MCO123456789'
                      to_sync_id:
                        type: string
                        description: ID de la publicación destino
                        example: 'MCO987654321'
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica si la operación fue exitosa
                    example: true
                  total_deleted:
                    type: integer
                    description: Número de relaciones eliminadas exitosamente
                    example: 3
                  total_failed:
                    type: integer
                    description: Número de relaciones que fallaron al eliminarse
                    example: 0
                  errors:
                    type: array
                    description: Lista de errores ocurridos durante la eliminación de relaciones
                    items:
                      type: object
                      properties:
                        publication_id:
                          type: string
                          description: ID de la publicación origen que falló
                          example: 'MCO123456789'
                        to_sync_id:
                          type: string
                          description: ID de la publicación destino que falló
                          example: 'MCO987654321'
                        message:
                          type: string
                          description: Mensaje de error
                          example: 'Relation does not exist'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica si la operación fue exitosa
                    example: false
                  total_deleted:
                    type: integer
                    description: Número de relaciones eliminadas exitosamente
                    example: 0
                  total_failed:
                    type: integer
                    description: Número de relaciones que fallaron al eliminarse
                    example: 1
                  errors:
                    type: array
                    description: Lista de errores ocurridos durante la eliminación de relaciones
                    items:
                      type: object
                      properties:
                        publication_id:
