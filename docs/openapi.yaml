                      descriptions:
                        - >-
                          Soporte plegable para tabletas, MacBook Notebook,
                          iPad, Laptops, PC y más.


                          Estuche incluido para transporte, evitate dolores de
                          espalda por mala postura


                          Ajuste Universal para laptops desde 6" hasta 16"
                          pulgadas, te ayuda a mejorar su alineación de la
                          columna, minimizar los dolores de espalda, prevenir la
                          fatiga visual e incluso eliminar la fatiga de la mano


                          Diseño ergonómico de 6 niveles: el soporte para
                          portátil eleva tu portátil de 2.15 a 6 pulgadas de
                          altura para un nivel de ojo perfecto, 6 opciones de
                          altura total, que fija tu postura y reduce el dolor de
                          espalda, rigidez del cuello y dolores de muñeca. Muy
                          cómodo para trabajar.


                          Olvídate de dolores crónicos en la parte superior de
                          la espalda y el cuello al elegir un soporte elevador
                          para portátil que facilita la alineación correcta de
                          la columna vertebral, ya sea sentado o acostado en la
                          cama.


                          Sobrecalentamiento del portátil, vea sus películas o
                          vídeos favoritos, disfrute de su bakfast y encuentre
                          su tranquilidad una vez más.


                          Por no mencionar que su diseño plegable y portátil
                          permite al usuario colapsarlo y llevarlo con ellos
                          cuando lo elija.


                          Fabricado con soportes de aleación de aluminio
                          antioxidado: ligero, duradero y tiene ventilador de
                          refrigeración para proteger su vida del portátil.


                          Los soportes de ordenador o tableta funcionarán: en la
                          cama, sofá, silla de clínica o cualquier superficie
                          irregular.


                          En aleación de aluminio - Diseño plegable y portable

                          Incluye Funda

                          Peso - 230 g

                          Resiste hasta 40 kg

                          Ajustable a 6 niveles de ajuste para lograr la
                          inclinación deseada

                          Estructura triangular estable.

                          compatibles con laptos desde 5.5" Hasta 16"
