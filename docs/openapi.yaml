                      descriptions:
                        - >-
                          CONCENTRADOR USB C MULTIPUERTO 10 EN 1

                          La base USB C inteligente combina perfectamente todas
                          las funciones que necesitas. Extiende un puerto tipo C
                          a un puerto HDMI de 4K a 30 Hz, 1 puerto VGA de 1080P
                          a 60 Hz, 1 puerto USB 3.0 x 3, Gigabit Ethernet,
                          lector de tarjetas SD/TF (Micro SD), conector de audio
                          de 0.138 in, puerto de carga de suministro de energía
                          USB-C x 1 (transferencia de datos no compatible).
                          Puede resolver perfectamente el problema de un solo
                          puerto USB C de su computadora portátil. Todos los
                          puertos de concentrador pueden funcionar
                          simultáneamente.


                          4K ULTRA HD Y PANTALLA CRISTALINA

                          Soporta duplicar tu pantalla a dos pantallas en 1080P
                          a 60Hz mediante el uso de puertos HDMI y VGA
                          simultáneamente, o transmite directamente video HD 4K
                          a HDTV, monitores o proyectores para una fiesta visual
                          similar al cine (AAA o ABB). La salida de video HDMI
                          soporta 4K @30Hz (compatible con versiones anteriores
                          con 1080P@120Hz y 2K @120Hz); VGA soporta 1080P @60Hz.


                          ENTREGA DE POTENCIA DE 100 W

                          El adaptador multipuerto USB C admite la carga de tu
                          laptop a una potencia de hasta 100 W (seguridad la
                          potencia de entrada específica está relacionada con tu
                          cargador). Y proporciona energía adicional para discos
                          duros, unidades de DVD y accesorios que se conectan al
                          puerto USB. No te preocupes de nuevo por que tu
                          dispositivo se quede sin energía.


                          TRANSFERENCIA DE DATOS DE 5 GBPS:

                          Estación de acoplamiento de doble monitor con 3
                          puertos USB 3.0 sincroniza datos a velocidades
                          asombrosas de hasta 5 Gbps. Ranuras SD y TF integradas
                          para un fácil acceso a los archivos desde la tarjeta
                          de memoria SD y Micro SD universal; el protocolo de
                          transmisión es de 480 Mbps, no admite 2 tarjetas de
                          lectura simultáneamente. El puerto Ethernet de 1000
                          Mbps garantiza una conexión de red por cable más
                          estable y rápida. También puede conectarlo a un
                          teléfono inteligente compatible con OTG para leer los
                          datos de su disco SD/HDD/flash.Admite salida de audio
                          de 0.138 in.


                          LO QUE OBTIENES

                          Concentrador USB-C 10 en 1 de ORICO con caja de
                          producto, manual (idioma español no garantizado). Este
                          concentrador USB C cuenta con una luz LED azul y un
                          diseño único de apariencia de luz indicadora con
                          características de marca altamente reconocibles.
                          Compatible con sistemas operativos multiplataforma
                          Windows, Mac, Linux, Android.
