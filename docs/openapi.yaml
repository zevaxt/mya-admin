                      descriptions:
                        - >-
                          ARRIBA, ABAJO, TODO ALREDEDOR

                          Esta cámara IP panorámica e inclinación ve todo en
                          toda una habitación o pasarela con el campo de visión
                          horizontal de 360° y vertical de 114°.


                          DETECCIÓN Y NOTIFICACIÓN INSTANTÁNEA: recibe
                          notificaciones instantáneas Cuando se detecta
                          movimiento o una persona, suscríbete a Tapo Care para
                          la detección de llanto del bebé para usarlo como
                          monitor de cámara de bebé. Discernir de las
                          notificaciones que importan, por lo que sabrás si es
                          tu mascota jugando o si alguien está allí.


                          AUDIO DE 2 VÍAS CON SIRENA INTEGRADA:

                          Nunca salgas de casa con el audio de 2 vías integrado.
                          Úsalo como una cámara para mascotas con aplicación de
                          teléfono para confortar a tu mascota desde cualquier
                          lugar del mundo. Mantén a tu familia segura con
                          cámaras para la seguridad del hogar en interiores
                          protegiendo de intrusos.


                          ALMACENAMIENTO LOCAL SEGURO O EN LA NUBE:

                          Guarda imágenes continuamente en una tarjeta microSD
                          de hasta 128 GB (no incluida) o suscríbete a Tapo Care
                          para almacenamiento en la nube que ahorra historial de
                          video de 30 días y proporciona beneficios adicionales
                          como seguimiento de movimiento, detección de llanto de
                          bebé y mucho más.


                          VISIÓN NOCTURNA DE HASTA 30 PIES:

                          Nunca te pierdas nada que continúa, incluso por la
                          noche gracias al sistema IR integrado en esta cámara
                          interior que proporciona 30 pies de visión nocturna.


                          1080P FULL HD

                          Captura cada detalle dentro de tu hogar con video Full
                          HD de 1080P nítido con esta cámara de seguridad
                          interior. Mira fácilmente lo que tu bebé está
                          sosteniendo o con qué está jugando tu mascota.


                          COMPARTIR DISPOSITIVOS:

                          Mira la alimentación de tu cámara WiFi desde dos
                          dispositivos de teléfono inteligente diferentes. Ahora
                          mamá y papá pueden ver lo que está sucediendo en casa
                          con una sola cámara, haciendo que vigilar a los más
                          pequeños sea un poco más fácil.


                          FUNCIONA CON ALEXA Y GOOGLE ASSISTANT:

                          Totalmente compatible con Amazon Alexa y Google
                          Assistant, utiliza tu simple comando de voz para ver
                          la cámara de seguridad interior Tapo en vivo en Echo
                          Show o Google Chrome Cast con una pantalla. Obtén
                          fácilmente las imágenes de seguridad de tu hogar en
                          una pantalla de TV más grande.
