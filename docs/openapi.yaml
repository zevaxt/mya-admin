    get:
      tags:
        - migration tag
      summary: /v1/migration/products/orphans/matching-title
      description: >-
        consultar el total de id de publicacionde de la cuenta y almacenar el
        detalle los productos
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          example: '2'
        - name: account-id-to
          in: header
          schema:
            type: integer
          example: '1'
        - name: status
          in: header
          schema:
            type: boolean
          description: true, false, all
          example: 'false'
        - name: with-sold-quantity
          in: header
          schema:
            type: boolean
          description: true, false, all
