                      descriptions:
                        - >-
                          Audífonos Bluetooth 5.0 Soundcore Q20 Anker 40 Horas
                          Cancelacion Ruido


                          CERTIFICACIÓN DE AUDIO DE ALTA RESOLUCIÓN

                          Escucha canciones de la forma en que se supone que
                          deben estar con el audio Hi-Res certificado por Life
                          Q20. Los controladores dinámicos personalizados de
                          1.575 in reproducen música con detalles ricos y
                          claridad extraordinaria para una experiencia auditiva
                          más alta.


                          CÓMO FUNCIONA ANC

                          Reduce los ruidos ambientales hasta en un 90%.
                          Sumérgete en la música mientras que 4 micrófonos y un
                          algoritmo digital ANC detectan y cancelan los ruidos
                          de baja y media frecuencia como los coches y los
                          motores de avión.


                          BLUETOOTH 5.

                          Obtenga una conexión ultrarrápida y prácticamente
                          irrompible entre los auriculares con cancelación
                          activa de ruido Life Q20 y su dispositivo móvil.
                          Compatible con smartphones, tabletas, ordenadores
                          portátiles y mucho más.


                          TECNOLOGÍA BASSUP
