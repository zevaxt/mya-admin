  /v1/migration/products/orphans:
    get:
      tags:
        - migration tag
      summary: /v1/migration/products/orphans
      description: >-
         NoSyncPublicationOrphan obtiene los IDs de las publicaciones que no están sincronizadas y son huérfanas
         Este handler identifica publicaciones que:
         1. Pertenecen a una cuenta específica (account-id)
         2. No están sincronizadas con otras cuentas (no aparecen en la tabla publication_tosync)
         3. No están activas en el catálogo (catalog_active = false)
         4. Opcionalmente, filtradas por estado (true/false/all)
         5. Opcionalmente, filtradas por cantidad vendida (con/sin ventas)
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: status
          in: header
          schema:
            type: boolean
          description: true, false, all
          example: 'true'
        - name: with-sold-quantity
          in: header
          schema:
            type: boolean
          description: true, false, all
          example: 'true'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
