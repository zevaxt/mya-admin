                          en todas las direcciones. El filtro POP de doble capa
                          y la tapa de espuma resistente al viento reducen aún
                          más el ruido, y luego es procesado por el chip DSP
                          profesional de la tarjeta de sonido para garantizar un
                          sonido claro y completo.


                          TARJETA DE SONIDO MULTIFUNCIONAL:

                          La tarjeta de sonido clásica V8 puede ajustar cuatro
                          modos de sonido para satisfacer las necesidades de tu
                          blog, y también puede ajustar cuatro variantes de
                          sonido (hembra, hombre, niño y monstruo) con 10
                          efectos de sonido especiales, añadiendo más diversión
                          a tu transmisión en vivo.


                          POTENTE COMPATIBILIDAD:

                          La interfaz de audio tiene una gran compatibilidad,
                          compatible con teléfonos inteligentes, PC,
                          PlayStations (PS4, Xbox...), y mucho más. Puede ser
                          compatible con Windows, iOS, Android, Mac OS, Chrome
                          OS y más. Este kit de dispositivo de podcast satisface
                          las necesidades de la mayoría de los escenarios.
                          Conducir gratis, plug and play.


                          CONEXIÓN USB PLUG AND PLAY:

                          Fácil como Plug and Play, simplemente utiliza los
                          cables, auriculares, para conectar con la tarjeta de
                          sonido y el equipo que deseas, y funciona
                          automáticamente con tu computadora portátil de
                          escritorio Mac o Windows, no requiere alimentación
                          fantasma, por favor, úsalo como completamente cargado.
                          (un software se descargará automáticamente)


                          MÉTODO DE CONEXIÓN

                          Computadora/Portátil

                          1. Para transmitir en vivo una computadora o portátil,
                          debe conectar el puerto de carga (no LIVE1/LIVE2) de
                          la tarjeta de sonido a través del cable de carga.

                          2. El ordenador identificará e instalará
                          automáticamente el controlador de la tarjeta de sonido

                          Teléfono inteligente

                          1. Utilice el cable de carga para conectar el puerto
                          de carga (hasta que se encienda el encendido).

                          2. Conecta el teléfono al LIVE1/LIVE2 de la tarjeta de
                          sonido a través del cable de audio (reauires y
                          adaptador de APPLE/TYPE-C.


                          ESPECIFICACIONES

                          Rango de frecuencia: 20 a 20.000 Hz

                          Sensibilidad: -34 d dB (0 dB=1V/Pa a 1kHz)

                          Nivel de ruido equivalente: 16 dB-A

                          Relación señal/ruido: 78 dB.

                          Impedancia: Menor a 200 OH

                          Impedancia de carga recomendada: mayor a 1000 ohmios

                          Conector: XLR de 3 pines a IEC


                          ATENCIÓN:

                          Cuando utilices el dispositivo por primera vez o el
                          producto no se ha utilizado durante mucho tiempo, te
                          sugerimos que primero cargues completamente la batería
                          para garantizar el uso normal del producto.
