openapi: 3.0.0
info:
  title: MercaloYa Doc
  version: 1.0.0
servers:
  - url: http://localhost:4200
components:
  schemas:
    Account:
      type: object
      properties:
        ID:
          type: integer
          format: uint
          description: ID único de la cuenta
        CreatedAt:
          type: string
          format: date-time
          description: Fecha de creación
        UpdatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización
        DeletedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de eliminación (soft delete)
        ProviderID:
          type: integer
          format: uint
          description: ID del proveedor asociado
        UserID:
          type: integer
          format: uint
          description: ID del usuario propietario
        AuthorizationCode:
          type: string
          description: Código de autorización
        Email:
          type: string
          description: Correo electrónico asociado a la cuenta
        Nickname:
          type: string
          description: Nombre de usuario en la plataforma
        Code:
          type: string
          description: Código identificador de la cuenta
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
tags:
  - name: session tag
  - name: provider tag
  - name: migration tag
  - name: account tag
paths:
  /v1/signup:
    post:
      tags:
        - session tag
      summary: /v1/signup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: admin
                password: admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
            Date:
              schema:
                type: string
                example: Mon, 21 Apr 2025 00:28:39 GMT
            Content-Length:
              schema:
                type: integer
                example: '222'
          content:
            application/json:
              schema:
                type: object
              example:
                ID: 1
                CreatedAt: '2025-04-20T19:28:39.089-05:00'
                UpdatedAt: '2025-04-20T19:28:39.089-05:00'
                DeletedAt: null
                Password: pass
                Username: admin
                Accounts: null
  /v1/signin:
    post:
      tags:
        - session tag
      summary: /v1/signin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: admin
                password: admin
      security:
        - noauthAuth: []
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
            Date:
              schema:
                type: string
                example: Mon, 21 Apr 2025 00:31:01 GMT
            Content-Length:
              schema:
                type: integer
                example: '222'
          content:
            application/json:
              schema:
                type: object
              example:
                ID: 1
                CreatedAt: '2025-04-20T19:28:39.089-05:00'
                UpdatedAt: '2025-04-20T19:28:39.089-05:00'
                DeletedAt: null
                Password: $2a$08$C4R7wShc6ucWDXiPXCpQVO69I2x97PBkwYNAsA//dj.hdUqFZffEe
                Username: admin
                Accounts: null
  /meli/login:
    post:
      tags:
        - session tag
      summary: /v1/signin Copy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: admin
                password: admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/migration/token/refresh/{id}:
    post:
      tags:
        - session tag
      summary: /v1/migration/token/refresh/{id}
      description: >-
        ### Refresh Migration Token


        Actualiza consultando token por id de la tabla refresh token.


        This endpoint allows the user to refresh a migration token.


        #### Request


        - Method: POST

        - URL: `{{sv}}/v1/migration/token/refresh/{id}`

        - Body:

            - `refresh_token` (text, required): The refresh token to be used for refreshing the migration token.


        #### Response


        The response for this request is a JSON schema. It includes the
        following properties:


        - `access_token`: The new access token.

        - `token_type`: The type of token.

        - `expires_in`: The duration for which the token is valid.

        - `refresh_token`: The new refresh token.
      requestBody:
        content: {}
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/migration/token/{id}:
    get:
      tags:
        - session tag
      summary: /v1/migration/token/{id}
      description: Consultar token por id de la tabla refresh token.
      security:
        - bearerAuth: []
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: '{{access_token}}'
        - name: authorization-to
          in: header
          schema:
            type: string
          description: token cuenta destino
          example: '{{access_token_mya}}'
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: account-id-to
          in: header
          schema:
            type: integer
          example: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/migration/update/products/one:
    post:
      tags:
        - provider tag
      summary: /v1/provider/migration/update/products/one
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      security:
        - bearerAuth: []
      parameters:
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: account-id-to
          in: header
          schema:
            type: integer
          example: '2'
        - name: publication-id
          in: header
          schema:
            type: string
          example: MCO1373151259
        - name: publication-id-to
          in: header
          schema:
            type: string
          example: MCO2855721930
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/products/ids:
    post:
      tags:
        - provider tag
      summary: /v1/migration/provider/ids
      requestBody:
        content: {}
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: '{{access_token_mya}}'
        - name: account-id
          in: header
          schema:
            type: integer
          example: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/publication/{id}:
    get:
      tags:
        - provider tag
      summary: v1/provider/publication/{id}
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: '{{access_token_mya}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/provider/publications/orphans:
    get:
      tags:
        - provider tag
      summary: Encontrar publicaciones huérfanas en DB
      description: >
        ### Descripción


        Este endpoint identifica las publicaciones almacenadas en la base de datos que ya no existen
        en Mercado Libre para una cuenta específica. Estas publicaciones son consideradas "huérfanas"
        ya que existen en la base de datos local pero ya no en el proveedor (Mercado Libre).


        ### Parámetros de la solicitud


        - **Method:** GET


        - **Endpoint:** `/v1/provider/publications/orphans`


        - **Headers requeridos:**
          - `account-id`: ID de la cuenta de Mercado Libre a consultar
          - `status` (opcional): Estado de las publicaciones a consultar. Valores permitidos: "active", "inactive", "paused", "deleted", "suspended", "freezed" o vacío.
          - `channels` (opcional): Canales de venta a consultar. Valores permitidos: "marketplace" (por defecto), "mshops", o "marketplace,mshops".
        ### Estructura de la respuesta


        La respuesta es un objeto JSON con los siguientes campos:


        - `total` (número): Cantidad total de publicaciones huérfanas encontradas.


        - `orphan_publication_ids` (array de strings): Lista de IDs de publicaciones que existen en la base de datos pero no en Mercado Libre.


        ### Códigos de respuesta


        - **200 OK**: La búsqueda se realizó correctamente.


        - **400 Bad Request**: Parámetros de solicitud inválidos.


        - **500 Internal Server Error**: Error al procesar la solicitud.


        ### Ejemplo de respuesta


        ```json
        {
          "total": 3,
          "orphan_publication_ids": [
            "MCO123456789",
            "MCO987654321",
            "MCO567891234"
          ]
        }
        ```
      parameters:
        - name: account-id
          in: header
          required: true
          description: ID de la cuenta de Mercado Libre a consultar
          schema:
            type: string
          example: '1'
        - name: status
          in: header
          description: Estado de las publicaciones a consultar
          schema:
            type: string
            enum:
                - active
                - inactive
                - paused
                - deleted
                - inactive
                - closed
                - ''
          example: 'active'
        - name: channels
          in: header
          description: Canales de venta a consultar
          schema:
            type: string
            enum:
              - marketplace
              - mshops
              - marketplace,mshops
          example: 'marketplace'
      responses:
        '200':
          description: Búsqueda exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Cantidad total de publicaciones huérfanas
                  orphan_publication_ids:
                    type: array
                    items:
                      type: string
                    description: Lista de IDs de publicaciones que existen en la base de datos pero no en Mercado Libre
        '400':
          description: Parámetros de solicitud inválidos
        '500':
          description: Error al procesar la solicitud
      security:
        - bearerAuth: []

  /v1/provider/publications/compare:
    get:
      tags:
        - provider tag
      summary: Comparar publicaciones en DB vs Mercado Libre
      description: >
        ### Descripción


        Este endpoint compara las publicaciones almacenadas en la base de datos con las publicaciones
        existentes en Mercado Libre para una cuenta específica. Devuelve una lista de IDs de publicaciones
        que existen en Mercado Libre pero no están registradas en la base de datos local.


        ### Parámetros de la solicitud


        - **Method:** GET


        - **Endpoint:** `/v1/provider/publications/compare`


        - **Headers requeridos:**
          - `account-id`: ID de la cuenta de Mercado Libre a consultar
          - `status`: Estado de las publicaciones a consultar
          - `channels`: Canales de venta a consultar


        ### Estructura de la respuesta


        La respuesta es un objeto JSON con los siguientes campos:


        - `total` (número): Cantidad total de publicaciones faltantes.


        - `missing_publication_ids` (array de strings): Lista de IDs de publicaciones que existen en Mercado Libre pero no en la base de datos.


        ### Códigos de respuesta


        - **200 OK**: La comparación se realizó correctamente.


        - **400 Bad Request**: Parámetros de solicitud inválidos.


        - **500 Internal Server Error**: Error al procesar la solicitud.


        ### Ejemplo de respuesta


        ```json
        {
          "total": 3,
          "missing_publication_ids": [
            "MCO123456789",
            "MCO987654321",
            "MCO567891234"
          ]
        }
        ```
      parameters:
        - name: account-id
          in: header
          required: true
          description: ID de la cuenta de Mercado Libre a consultar
          schema:
            type: string
          example: '1'
        - name: status
          in: header
          description: Estado de las publicaciones a consultar
          schema:
            type: string
            enum:
                - active
                - inactive
                - paused
                - deleted
                - inactive
                - closed
                - ''
          example: 'active'
        - name: channels
          in: header
          description: Canales de venta a consultar
          schema:
            type: string
            enum:
              - marketplace
              - marketplace,mshops
          example: 'marketplace'
      responses:
        '200':
          description: Comparación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Cantidad total de publicaciones faltantes
                  missing_publication_ids:
                    type: array
                    items:
                      type: string
                    description: Lista de IDs de publicaciones que existen en Mercado Libre pero no en la base de datos
        '400':
          description: Parámetros de solicitud inválidos
        '500':
          description: Error al procesar la solicitud
      security:
        - bearerAuth: []
  /v1/migration/products/ids:
    get:
      tags:
        - migration tag
      summary: https://mercaloyaapi.loca.lt/v1/migration/products/ids
      parameters:
        - name: offset
          in: query
          description: Número de registros a omitir (para paginación)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          description: Número máximo de registros a devolver (para paginación)
          schema:
            type: integer
            default: 100
            minimum: 1
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
      description: >-
        ### Get Product IDs for Migration


        Consulta los ids almacenados en la bd de una cuenta


        ### Response Structure


        The response is a JSON object containing the following fields:


        - `publications_ids` (array of strings): An array containing the product IDs.

        - `total` (number): The total count of product IDs available for the account.

        - `offset` (number): The offset used in the request.

        - `limit` (number): The limit used in the request.


        Example:


        ``` json

        {
            "publications_ids": ["MCO1119265852", "MCO1146473973", "MCO1149637532"],
            "total": 437,
            "offset": 0,
            "limit": 3
        }

        ```
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/migration/products:
    get:
      tags:
        - migration tag
      summary: /v1/migration/products/
      parameters:
        - name: offset
          in: query
          description: Número de registros a omitir (para paginación)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          description: Número máximo de registros a devolver (para paginación)
          schema:
            type: integer
            default: 100
            minimum: 1
        - name: account-id
          in: header
          schema:
            type: integer
          example: '1'
      description: >-
        ### Request Description


        This API endpoint retrieves a list of products that have been migrated
        to the database. It is used to consult all stored publications.


        ### Request Format


        - **Method:** GET

        - **Endpoint:** `{{sv}}/v1/migration/products`


        ### Response Structure


        The response is a JSON object containing the following fields:


        - **products**: Array of product objects, each containing:
          - **ID**: Unique identifier for the product.
        - **total**: Total number of products available for the account.
        - **offset**: The offset used in the request.
        - **limit**: The limit used in the request.
            - **tags**: Array of tags associated with the product.

            - **price**: Price of the product.

            - **title**: Title of the product.

            - **health**: Health status of the product.

            - **status**: Current status of the product.

            - **site_id**: Identifier for the site.

            - **channels**: Array of channels where the product is listed.

            - **deal_ids**: Array of deal identifiers.

            - **end_time**: End time of the product listing.

            - **location**: Object containing location details.

            - **pictures**: Array of picture objects with details such as id, url, size, quality, and secure_url.

            - **shipping**: Object containing shipping details including mode, tags, methods, dimensions, and shipping options.

            - **subtitle**: Subtitle of the product (if any).

            - **video_id**: Video identifier (if applicable).

            - **warnings**: Array of warnings related to the product.

            - **warranty**: Warranty information.

            - **condition**: Condition of the product.

            - **domain_id**: Identifier for the domain.

            - **permalink**: Permalink for the product.

            - **seller_id**: Identifier for the seller.

            - **stop_time**: Stop time for the product listing.

            - **thumbnail**: Thumbnail image of the product.

            - **attributes**: Array of attribute objects detailing product characteristics.

            - **base_price**: Base price of the product.

            - **sale_terms**: Array of sale term objects.

            - **start_time**: Start time for the product listing.

            - **sub_status**: Array of sub-statuses.

            - **variations**: Array of product variations.

            - **buying_mode**: Buying mode for the product.

            - **category_id**: Identifier for the product category.

            - **currency_id**: Currency identifier.

            - **geolocation**: Object containing latitude and longitude.

            - **date_created**: Creation date of the product listing.

            - **descriptions**: Array of product descriptions.

            - **inventory_id**: Identifier for the inventory.

            - **last_updated**: Last updated timestamp.

            - **thumbnail_id**: Identifier for the thumbnail.

            - **sold_quantity**: Quantity sold.

            - **coverage_areas**: Array of coverage areas.

            - **item_relations**: Array of item relation objects.

            - **listing_source**: Source of the listing.

            - **original_price**: Original price of the product.

            - **parent_item_id**: Identifier for the parent item (if applicable).

            - **seller_address**: Object containing seller's address details.

            - **seller_contact**: Seller contact information (if available).

            - **catalog_listing**: Boolean indicating if it's a catalog listing.

            - **expiration_time**: Expiration time for the listing.

            - **listing_type_id**: Identifier for the listing type.

            - **automatic_relist**: Boolean indicating if the product should be automatically relisted.

            - **initial_quantity**: Initial quantity of the product.

            - **secure_thumbnail**: Secure thumbnail URL.

            - **official_store_id**: Identifier for the official store (if applicable).

            - **available_quantity**: Quantity available for sale.

            - **catalog_product_id**: Identifier for the catalog product.

            - **accepts_mercadopago**: Boolean indicating if MercadoPago is accepted.

            - **seller_custom_field**: Custom field for the seller (if applicable).

            - **differential_pricing**: Differential pricing information (if applicable).

            - **international_delivery_mode**: Mode for international delivery.

            - **non_mercado_pago_payment_methods**: Array of non-MercadoPago payment methods.


        ### Response Code


        - **200 OK**: Indicates that the request was successful and the product
        data is returned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
