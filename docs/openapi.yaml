                      descriptions:
                        - >-
                          •Rueda abrasiva sintética que ofrece una capacidad de
                          ajuste de borde rápido.

                          •Las guías de cuchilla mantienen el cuchillo en el
                          ángulo de afilado correcto.

                          •Ángulos de afilado predefinidos para resultados
                          garantizados, varillas de cerámica cruzadas para
                          afilado de bordes finales.

                          •Mango de goma para mayor comodidad y control, pies de
                          goma antideslizantes para mayor seguridad, se enchufa
                          a una toma estándar de 110 V.

                          •No recargable.


                          El afilador de cuchillos eléctrico o manual compacto
                          KitchenIQ Gourmet presenta un afilado eléctrico y
                          manual en una unidad compacta.

                          Las ranuras de afilado eléctrico cuentan con una rueda
                          de afilado abrasivo sintético con guías de cuchilla
                          para sostener automáticamente la cuchilla en el ángulo
                          de afilado correcto.

                          Después de afilar con la rueda de afilar eléctrica,
                          KitchenIQ recomienda usar las varillas de cerámica
                          para afilar el borde final. Las varillas de cerámica
                          cruzadas crean un ángulo de afilado preestablecido que
                          afila ligeramente ambos lados de la cuchilla al mismo
                          tiempo, poniendo un filo pulido y afilado en su
                          cuchillo. Las varillas de cerámica cruzadas también se
                          pueden usar para retocar rápidamente un cuchillo ya
                          afilado. Esta unidad afilará cuchillos domésticos de
                          aleación, carbono o acero inoxidable.
