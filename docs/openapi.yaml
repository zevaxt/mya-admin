  /v1/users/{userId}/accounts:
    get:
      tags:
        - account tag
      summary: Obtener cuentas por ID de usuario
      description: Obtiene todas las cuentas asociadas a un usuario específico
      parameters:
        - name: userId
          in: path
          required: true
          description: ID del usuario
          schema:
            type: integer
            format: uint
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de cuentas obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
              example:
                - ID: 1
                  CreatedAt: '2025-09-19T15:30:45.123-05:00'
                  UpdatedAt: '2025-09-19T15:30:45.123-05:00'
                  DeletedAt: null
                  ProviderID: 1
                  UserID: 1
                  AuthorizationCode: 'auth_code_123'
                  Email: 'usuario1@example.com'
                  Nickname: 'usuario1'
                  Code: 'ML123456'
                - ID: 2
                  CreatedAt: '2025-09-19T16:15:22.456-05:00'
                  UpdatedAt: '2025-09-19T16:15:22.456-05:00'
                  DeletedAt: null
                  ProviderID: 2
                  UserID: 1
                  AuthorizationCode: 'auth_code_456'
                  Email: 'usuario1_cuenta2@example.com'
                  Nickname: 'usuario1_wix'
                  Code: 'WIX789012'
        '400':
          description: ID de usuario inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'ID de usuario inválido'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Error al obtener cuentas para el usuario'
