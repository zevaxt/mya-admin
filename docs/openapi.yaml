                    Función de vibración y sensor giroscopio: nuestro
                    controlador inalámbrico tiene un motor dual integrado para
                    darte una retroalimentación de juego más fresca y realista,
                    así como un giroscopio integrado de 6 ejes para mejorar la
                    precisión y detectar cada detalle de tu movimiento para un
                    control más preciso.


                    Bajo consumo de energía, larga duración de la batería: este
                    controlador perfecto tiene una batería de litio de alto
                    rendimiento con apagado automático, aviso de carga y
                    advertencia de bajo voltaje. La batería integrada de 600 mAh
                    de alto rendimiento puede servir durante 8-10 horas después
                    de cargarse completamente, asegúrate de que puedes disfrutar
                    de juegos durante más tiempo sin interrupciones.


                    Diseño ergonómico y función turbo: el controlador
                    inalámbrico está construido con una construcción ergonómica
                    y ligera, lo que lo hace cómodo incluso durante largas horas
                    de juego continuo, y no tienes que preocuparte por el sudor
                    en tus manos. El controlador de interruptor inalámbrico se
                    puede ajustar al modo turbo automático o turbo manual. Hay 3
                    velocidades ajustables: 5 disparos/s, 12 disparos/s o 20
                    disparos/s.


                    Captura de pantalla y conexión Bluetooth inalámbrica: la
                    función de captura de pantalla continua del controlador
                    Switch Pro te ayuda a jugar más cómodamente. El controlador
                    para interruptor proporciona una señal estable y fiable sin
                    demora. Cuenta con una fuerte tecnología antiinterferencias
                    y no se verá afectado por otros dispositivos inalámbricos.
